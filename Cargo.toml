[package]
name = "epy"
version = "0.1.0"
edition = "2024"
description = "Energy plotting library"

[features]
debug_rect = []
# Size axes with `scale only axis`: `\epyfigurewidth` and `\epyheightratio` then
# describe the plot area itself, and labels are placed outside of it.
scale_only_axis = []

[dependencies]
csv = "1.4.0"
derive_builder = "0.20.2"
ordered-float = "5.5.0"
ordermap = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
statrs = "0.19.1"
